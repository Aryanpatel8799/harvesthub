services:
  - type: web
    name: harvesthub-backend
    env: node
    plan: free
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        value: mongodb+srv://your-username:your-password@your-cluster.mongodb.net/harvesthub
      - key: JWT_SECRET
        value: your-super-secret-jwt-key-here
      - key: SESSION_SECRET
        value: your-super-secret-session-key-here
      - key: STRIPE_SECRET_KEY
        value: sk_test_your_stripe_secret_key
      - key: STRIPE_WEBHOOK_SECRET
        value: whsec_your_stripe_webhook_secret
      - key: CLIENT_URL
        value: http://localhost:8080

  - type: web
    name: harvesthub-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_ENV
        value: production 